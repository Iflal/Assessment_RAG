[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-generator"
version = "0.1.0"
description = "A local document ingestion and grounded RAG application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.1,<2",
    "groq>=1.7,<2",
    "pypdf>=5.4,<7",
    "python-dotenv>=1.1,<2",
    "sentence-transformers>=5.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
rag = "rag_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
